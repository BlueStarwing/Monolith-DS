- type: entity
  parent: ClothingNeckBase
  id: ClothingNeckCloakBlueStar
  name: Плащ голубой звезды.
  description: Тёплый уютный плащ что имеет внутри шерстяной слой что укрывает от холода. На спине же красовалась эмблема в виде четырёх-лучевой звезды.
  components:
  - type: Sprite
    sprite: _LuaM/Clothing/Necks/AkiPlash.rsi/AkiPlash-base.rsi
    requiredSlot:
    - neck
    slot: head
  - type: ContainerContainer
    containers:
      toggleable-clothing: !type:ContainerSlot {}

